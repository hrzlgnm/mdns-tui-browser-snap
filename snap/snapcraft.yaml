name: mdns-tui-browser
base: core24
# Replaced by CI with the version being packaged.
version: '0.0.0'
summary: A TUI browser for mDNS service discovery
description: |
  A terminal UI for browsing services advertised via mDNS on your local
  network.
grade: stable
confinement: strict
license: MIT
platforms:
  amd64:

apps:
  mdns-tui-browser:
    command: bin/mdns-tui-browser
    plugs:
      - network
      - network-bind

parts:
  mdns-tui-browser:
    plugin: nil
    # Inject the workflow token into the LXD build environment so the
    # gh attestation verify call (which requires a token even for public
    # repos) can authenticate. Snapcraft does not forward host env vars
    # into the --use-lxd container on its own.
    build-environment:
      - GH_TOKEN: ${GH_TOKEN}
    override-build: |
      set -eu
      version="$(craftctl get version)"
      tag="v${version}"
      asset="mdns-tui-browser-v${version}-Linux-x86_64.tar.gz"
      url="https://github.com/hrzlgnm/mdns-tui-browser/releases/download/${tag}/${asset}"

      curl -fsSL -o release.tar.gz "$url"

      # Verify the tarball's SLSA build provenance: proves it was produced
      # by the upstream release workflow from the tagged source, not merely
      # that it matches the digest GitHub lists for the release asset.
      # core24's apt `gh` (2.45) predates the `attestation` subcommand, so
      # fetch a static CLI build and pin its checksum.
      gh_ver=2.98.0
      gh_tarball="gh_${gh_ver}_linux_amd64.tar.gz"
      curl -fsSL -o "$gh_tarball" \
        "https://github.com/cli/cli/releases/download/v${gh_ver}/${gh_tarball}"
      printf '%s  %s\n' \
        "3b8ac6b30336802fc1a858d7c084e11cdf24ac1a761ca90b68022d7d729208de" \
        "$gh_tarball" | sha256sum --check --status
      tar -xzf "$gh_tarball"
      gh_bin="$(pwd)/gh_${gh_ver}_linux_amd64/bin/gh"

      "$gh_bin" attestation verify release.tar.gz \
        --repo hrzlgnm/mdns-tui-browser \
        --cert-identity "https://github.com/hrzlgnm/mdns-tui-browser/.github/workflows/build-reusable.yml@refs/tags/${tag}"

      root="${asset%.tar.gz}"
      tar xzf release.tar.gz
      install -Dm755 "${root}/mdns-tui-browser" \
          "$CRAFT_PART_INSTALL/bin/mdns-tui-browser"
      install -Dm644 "${root}/man/man1/mdns-tui-browser.1" \
          "$CRAFT_PART_INSTALL/share/man/man1/mdns-tui-browser.1"
    build-packages:
      - ca-certificates
      - curl
