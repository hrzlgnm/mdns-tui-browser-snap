name: Pin release version
description: Rewrites snap/snapcraft.yaml's version to a specific hrzlgnm/mdns-tui-browser release
inputs:
  tag:
    description: Upstream tag to pin, e.g. v1.34.2. Defaults to the latest upstream release.
    required: false
    default: ""
outputs:
  tag:
    description: The upstream release tag that was pinned
    value: ${{ steps.pin.outputs.tag }}
  asset:
    description: The release asset filename for the pinned version
    value: ${{ steps.pin.outputs.asset }}
runs:
  using: composite
  steps:
    - id: pin
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        INPUT_TAG: ${{ inputs.tag }}
        UPSTREAM_REPO: hrzlgnm/mdns-tui-browser
      run: |
        set -euo pipefail
        auth=(-H "Authorization: Bearer $GH_TOKEN")
        if [ -z "$INPUT_TAG" ]; then
            TAG="$(curl -fsSL "${auth[@]}" \
                "https://api.github.com/repos/$UPSTREAM_REPO/releases/latest" \
                | python3 -c 'import json, sys; print(json.load(sys.stdin)["tag_name"])')"
        else
            TAG="$INPUT_TAG"
        fi
        curl -fsSL "${auth[@]}" \
            "https://api.github.com/repos/$UPSTREAM_REPO/git/ref/tags/$TAG" > /dev/null
        VERSION="${TAG#v}"
        sed -i "s|^version:.*|version: '$VERSION'|" snap/snapcraft.yaml
        echo "Pinned snap version to $VERSION (tag $TAG):"
        grep '^version:' snap/snapcraft.yaml
        echo "tag=$TAG" >> "$GITHUB_OUTPUT"
        echo "asset=mdns-tui-browser-${TAG}-Linux-x86_64.tar.gz" >> "$GITHUB_OUTPUT"
